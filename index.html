<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Plastic – Cari Tempat Sampah Plastik Terdekat</title>
  <style>
    :root {
      --hijau: #1f8a4c;
      --hijau-tua: #166638;
      --latar: #f3f8f4;
      --teks: #1d2b22;
      --abu: #5d6b62;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--latar);
      color: var(--teks);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .kartu {
      background: #fff;
      max-width: 420px;
      width: 100%;
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }
    h1 { margin: 0 0 6px; font-size: 1.6rem; color: var(--hijau-tua); }
    p.sub { margin: 0 0 24px; color: var(--abu); line-height: 1.5; }
    button, a.tombol {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 10px;
    }
    button { background: var(--hijau); color: #fff; }
    button:hover { background: var(--hijau-tua); }
    button:disabled { opacity: 0.6; cursor: wait; }
    a.tombol { background: #e7f4ec; color: var(--hijau-tua); }
    a.tombol:hover { background: #d4ecdd; }
    #status { color: var(--abu); font-size: 0.9rem; min-height: 1.2em; margin: 8px 0 16px; }
    #hasil { display: none; text-align: left; }
    #hasil h2 { font-size: 1rem; margin: 0 0 10px; }
    footer { margin-top: 18px; font-size: 0.8rem; color: var(--abu); }
  </style>
</head>
<body>
  <main class="kartu">
    <h1>♻️ Zero Plastic</h1>
    <p class="sub">Temukan tempat pengolahan dan daur ulang sampah plastik terdekat dari lokasimu.</p>

    <button id="cari">📍 Cari yang terdekat</button>
    <div id="status"></div>

    <div id="hasil">
      <h2>Buka di Google Maps:</h2>
      <div id="daftar"></div>
    </div>

    <footer>Lokasimu hanya dipakai untuk membuka Google Maps dan tidak disimpan.</footer>
  </main>

  <script>
    // Kata kunci pencarian di Google Maps. Silakan tambah/ubah.
    const KATA_KUNCI = [
      { label: "🏦 Bank sampah", q: "bank sampah" },
      { label: "♻️ Daur ulang plastik", q: "daur ulang plastik" },
      { label: "🗑️ TPS3R / pengolahan sampah", q: "TPS3R" }
    ];

    const tombol = document.getElementById("cari");
    const statusEl = document.getElementById("status");
    const hasil = document.getElementById("hasil");
    const daftar = document.getElementById("daftar");

    function tampilkanLink(lat, lng) {
      daftar.innerHTML = "";
      KATA_KUNCI.forEach(item => {
        const a = document.createElement("a");
        a.className = "tombol";
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = item.label;
        a.href = (lat !== null)
          ? `https://www.google.com/maps/search/${encodeURIComponent(item.q)}/@${lat},${lng},14z`
          : `https://www.google.com/maps/search/${encodeURIComponent(item.q + " terdekat")}`;
        daftar.appendChild(a);
      });
      hasil.style.display = "block";
    }

    tombol.addEventListener("click", () => {
      if (!navigator.geolocation) {
        statusEl.textContent = "Browser tidak mendukung lokasi. Pakai pencarian umum di bawah.";
        tampilkanLink(null, null);
        return;
      }
      tombol.disabled = true;
      statusEl.textContent = "Meminta izin lokasi…";

      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude.toFixed(6);
          const lng = pos.coords.longitude.toFixed(6);
          statusEl.textContent = "Lokasi ditemukan. Pilih yang ingin dicari:";
          tampilkanLink(lat, lng);
          tombol.disabled = false;
        },
        () => {
          statusEl.textContent = "Izin lokasi ditolak. Google Maps akan mencari berdasarkan lokasimu di sana.";
          tampilkanLink(null, null);
          tombol.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });
  </script>
</body>
</html>
